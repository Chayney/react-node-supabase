options:
  logging: CLOUD_LOGGING_ONLY

steps:
# ------------------- Backend Build -------------------
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build \
        -f backend/docker/node/Dockerfile.production \
        --build-arg NODE_ENV=${_NODE_ENV} \
        -t gcr.io/$PROJECT_ID/backend:$COMMIT_SHA \
        backend

# ------------------- Frontend Build -------------------
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker build \
        --build-arg VITE_REACT_APP_API_URL=${_VITE_REACT_APP_API_URL} \
        -t gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA \
        frontend

# ------------------- Push Images -------------------
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','gcr.io/$PROJECT_ID/backend:$COMMIT_SHA']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push','gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA']

# ------------------- Backend Deploy -------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run','deploy','backend-node',
      '--image','gcr.io/$PROJECT_ID/backend:$COMMIT_SHA',
      '--region','asia-northeast1',
      '--platform','managed',
      '--allow-unauthenticated',
      '--set-env-vars',
      'SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},FRONTEND_URL=${_FRONTEND_URL},NODE_ENV=production'
    ]

# ------------------- Backend IAM Public -------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run','services','add-iam-policy-binding','backend-node',
      '--member=allUsers',
      '--role=roles/run.invoker',
      '--region=asia-northeast1'
    ]

# ------------------- Frontend Deploy -------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run','deploy','frontend',
      '--image','gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA',
      '--region','asia-northeast1',
      '--platform','managed',
      '--allow-unauthenticated'
    ]

# ------------------- Frontend IAM Public -------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run','services','add-iam-policy-binding','frontend',
      '--member=allUsers',
      '--role=roles/run.invoker',
      '--region=asia-northeast1'
    ]

images:
- gcr.io/$PROJECT_ID/backend:$COMMIT_SHA
- gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA